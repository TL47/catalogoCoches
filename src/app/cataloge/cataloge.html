<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>
</head>
<body>
    <header>
        <h1>Catálogo</h1>
        <h2>Esto es el catálogo donde puede consultar los coches de la colección</h2>
    </header>
    <main>
        <!-- Aquí aparecen los coches -->
        <div class="contenido">
            
        </div>
        <!-- Filtros para aplicar a la busqueda de coches -->
        <div class="filtros">
            <!-- Barra de busqueda -->
            <div class="busqueda">
                <form>
                    <label for="search">Buscar: </label>
                    <input type="text" name="search" id="search">
                </form>
            </div>
        </div>
    </main>
</body>
</html>
