<div class="body">
    <div class="contenedor-form ">

        <h1 class="titulo-form">Modificar</h1>

        <form>
        <div class="control-area form-coche">
            <div class="fila-detalles">
                    <div class="grupo-input">
                        <label class="grupo-input" for="Marca">Marca: </label>
                        <input class="control-input" type="text" id="Marca" name="Marca" placeholder="Introduce la Marca" required>
                    </div>
                    <div class="grupo-input">
                        <label class="grupo-input" for="Modelo">Modelo: </label>
                        <input class="control-input" type="text" id="Modelo" name="Modelo" placeholder="Introduce el Modelo" required>
                    </div>
                </div>
                <div class="fila-detalles">
                    <div class="grupo-input">
                        <label for="Matrícula">Matrícula: </label>
                        <input class="control-input" type="text" id="Matrícula" name="Matrícula" placeholder="Introduce la Matrícula" required>
                    </div>
                    <div class="grupo-input">
                        <label class="grupo-input" for="Año">Año: </label>
                        <input class="control-input" type="number" id="Año" min="1886" max="2026" name="Año" placeholder="Introduce el Año" required>
                    </div>
                </div>
                <div class="fila-detalles">
                    <div class="grupo-input">
                        <label class="grupo-input" for="Precio">Precio: </label>
                        <input class="control-input" type="number" id="Precio" step="0.01" min="0" name="Precio" placeholder="Introduce el Precio" required>
                    </div>
                    <div class="grupo-input">
                        <label class="grupo-input" for="kilometraje">Kilometraje: </label>
                        <input class="control-input" type="number" id="kilometraje" min="0" step="0.01" name="kilometraje" placeholder="Introduce el Kilometraje" required>
                    </div>
                </div>
                <div class="grupo-input">
                    <label for="combustible">Combustible:</label>
                    <select id="combustible" class="control-select">
                        <option value="gasolina">Gasolina</option>
                        <option value="diesel">Diésel</option>
                        <option value="electrico">Eléctrico</option>
                        <option value="hibrido">Híbrido</option>
                    </select>
                <div class="grupo-input">
                    <label for="transmision">Cambio:</label>
                    <select id="transmision" class="control-select">
                        <option value="manual">Manual</option>
                        <option value="automatico">Automático</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label class="grupo-input" for="image">Imagen: </label>
                    <input class="control-input" type="url" id="Imagen" name="Imagen" placeholder="Introduce la URL de la imagen" required>
                </div>
                <div class="grupo-input">
                    <label class="grupo-input" for="descripcion">Descripcion: </label>
                    <input class="control-input" type="text" id="Descripcion" name="Descripcion" placeholder="Introduce una Descripción" required>
                </div>
                <div class="acciones">
                    <div>
                        <button class="btn-guardar" type="submmit">Subir</button>
                    </div>
                    <div>
                        <button class="btn-limpiar" type="reset">Limpiar</button>
                    </div>
                </div>
            </div>
        </div>
        </form>
</div>
